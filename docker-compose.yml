services:
  postgres-data-init:
    image: postgres:16-alpine
    user: "0:0"
    restart: "no"
    environment:
      LEGACY_POSTGRES_DIR: /legacy-postgres
      POSTGRES_DATA_DIR: /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/legacy-postgres:ro
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-data.sh:/scripts/init-postgres-data.sh:ro
    entrypoint: ["sh", "/scripts/init-postgres-data.sh"]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=${APP_TIMEZONE:-Asia/Tbilisi}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-furniture_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${APP_TIMEZONE:-Asia/Tbilisi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      postgres-data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-furniture_inventory} && psql -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-furniture_inventory} -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 60s
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-furniture_inventory}
      PGUSER: ${POSTGRES_USER:-inventory}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      UPLOAD_DIR: /app/uploads
      PORT: 4000
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tbilisi}
      TZ: ${APP_TIMEZONE:-Asia/Tbilisi}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      MIGRATIONS_DIR: /app/migrations
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-4000}:4000"
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-furniture_inventory}
      PGUSER: ${POSTGRES_USER:-inventory}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGCONNECT_TIMEOUT: 10
      TZ: ${APP_TIMEZONE:-Asia/Tbilisi}
      BACKUP_ROOT: /backups
      UPLOAD_ROOT: /uploads
      CHECK_INTERVAL_SECONDS: ${BACKUP_CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data/backups:/backups
      - ./data/uploads:/uploads:ro
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/scripts/backup.sh", "daemon"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-romclassic_postgres_data}
